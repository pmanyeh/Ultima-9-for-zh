; U9-CHT player settings (example). Copy this file somewhere private, e.g. .local/u9cht.ini,
; and pass it to the launcher with:  U9ChtLauncher.exe ... --config <your copy>
;
; Encoding: plain ASCII, or "UTF-16 LE" (Notepad: Save As > Encoding) when a path contains
; non-ASCII characters. Windows reads this format; UTF-8 is not understood.
;
; Rules (runtime 0.2.14):
; - Only the settings listed here exist. Any other section or key is an error, so a setting
;   is never silently ignored. More settings will be added as each one is implemented.
; - Relative paths resolve against the directory of this file.

[font]
; A single-face TrueType/OpenType font (.ttf or .otf; .ttc collections are not supported).
; Every Chinese character used by the translation must exist in the font and advance exactly
; one full cell (the usual for CJK fonts). Otherwise the launcher refuses to start the game,
; and the game is never resumed with a broken layout.
; Check a font without launching the game:
;   U9ChtShowcaseCheck.exe <allowlist.u9ct> <font file> <fresh log.jsonl>
file = fonts/YourChineseFont.ttf

[journal]
; Chinese in the journal (diary) page. The journal is wrapped by the game itself, so these
; can be changed freely without rebuilding anything. Units are page-texture pixels
; (the page is 256 px wide); omitted keys use the defaults shown.
; Extra space between Chinese characters, 0..8.
letter_spacing = 2
; Extra space between journal lines, 0..16.
line_spacing = 3
